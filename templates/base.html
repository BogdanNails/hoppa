<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoppa Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Hoppa logo" onerror="this.onerror=null;this.src='{{ url_for('static', filename='hoppa-logo.svg') }}';">
    <strong>Hoppa Manager</strong>
  </div>
  <nav>
    <a href="{{ url_for('index') }}">Check-in</a>
    <a href="{{ url_for('children') }}">Lista copii</a>
    <a href="{{ url_for('cards') }}">Carduri</a>
    <a href="{{ url_for('subscriptions') }}">Abonamente</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash {{cat}}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
