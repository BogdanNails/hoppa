{% extends 'base.html' %}
{% block content %}
<div class="split-head">
  <h1>Check-in copil</h1>
  <button class="btn" onclick="toggleExtra()">Adaugare bani</button>
</div>
<form class="card" method="post" action="{{ url_for('checkin') }}">
  <h3>Copil principal</h3>
  {% include '_child_fields.html' with context %}
  <div id="siblings"></div>
  <button type="button" class="btn secondary" onclick="addSibling()">Adaugare frate</button>
  <button class="btn" type="submit">Salveaza check-in</button>
</form>

<form id="extraBox" class="card hidden" method="post" action="{{ url_for('extra_payment') }}">
  <h3>Adaugare bani</h3>
  <label>Suma <input name="amount" type="number" step="0.01" required></label>
  <label>Metoda plata
    <select name="payment_method"><option value="cash">cash</option><option value="card">card</option><option value="mixt">mixt</option></select>
  </label>
  <label>Ce achita
    <select name="reason"><option value="restanta">restanta</option><option value="baloane">baloane</option><option value="sosete">sosete</option></select>
  </label>
  <button class="btn">Salveaza</button>
</form>
{% endblock %}
